<nav aria-label="Navegaci&#243;n principal">
  <span class="nav-group-label">Navegaci&#243;n</span>
  <ng-container *ngFor="let item of menuItems">
    <a *ngIf="!item.children" class="nav-row"
       [routerLink]="item.url" routerLinkActive="active-link"
       ariaCurrentWhenActive="page" (click)="onItemClick()">
      <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
      <span class="nav-label">{{ item.title }}</span>
    </a>

    <details *ngIf="item.children" class="nav-group">
      <summary class="nav-row">
        <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
        <span class="nav-label">{{ item.title }}</span>
        <mat-icon class="nav-chevron" aria-hidden="true">expand_more</mat-icon>
      </summary>
      <a class="nav-row nav-child" *ngFor="let child of item.children"
         [routerLink]="child.url" routerLinkActive="active-link"
         ariaCurrentWhenActive="page" (click)="onItemClick()">
        <span class="nav-bullet" aria-hidden="true">&#8226;</span>
        <span class="nav-label">{{ child.title }}</span>
      </a>
    </details>
  </ng-container>
</nav>
