networks:
  app_network:
    name: academiadigital_app_network
    driver: bridge

services:
  db:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Admin1234!}"
      POSTGRES_DB: "${POSTGRES_DB:-AcademiaDigital}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-AcademiaDigital}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app_network

  finance_api:
    container_name: finance_api
    build:
      context: ./services
      dockerfile: AcademiaDigital.Finance/Dockerfile
    expose:
      - "8091"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8091
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${FINANCE_POSTGRES_DB:-academiadigital_finance};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Admin1234!}
      - Monolith__BaseUrl=http://backend:8000
      - ReceiptStorage__RootPath=/app/data/receipts
    volumes:
      - finance_files:/app/data/receipts
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    container_name: dotnet_backend
    build:
      context: .
      dockerfile: backend-dotnet/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-AcademiaDigital};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Admin1234!}
      - Jwt__SecretKey=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - Jwt__ExpirationDays=7
      - Cors__AllowedOrigins__0=http://localhost:4200
      - Cors__AllowedOrigins__1=http://localhost:8090
      - AdmissionStorage__RootPath=/app/data/admissions
      - Finance__BaseUrl=http://finance_api:8091
    volumes:
      - backend_files:/app/data/admissions
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    container_name: angular_frontend
    build:
      context: ./frontend-angular
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
  backend_files:
  finance_files:
