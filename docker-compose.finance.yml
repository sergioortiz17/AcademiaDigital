# Compatibilidad para iniciar Finance por separado contra la infraestructura principal.
# El flujo recomendado es `docker compose up`, que ya incluye este servicio.
#
#   docker compose up -d db
#   docker compose -f docker-compose.finance.yml up --build

networks:
  academiadigital_app_network:
    external: true

services:
  finance_api:
    container_name: finance_api
    build:
      context: ./services
      dockerfile: AcademiaDigital.Finance/Dockerfile
    ports:
      - "8091:8091"
    networks:
      - academiadigital_app_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8091
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${FINANCE_POSTGRES_DB:-academiadigital_finance};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Admin1234!}
      - Monolith__BaseUrl=http://backend:8000
      - ReceiptStorage__RootPath=/app/data/receipts
    volumes:
      - finance_files:/app/data/receipts
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  finance_files:
