<div class="auth-container">
  <button class="back-button">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <section class="welcome-section">
    <!-- Logo e isotipo son los del ITSC; las demás instituciones muestran su nombre. Hasta que carga no se muestra ninguno, para no mostrar un logo ajeno. -->
    <ng-container *ngIf="tenant$ | async as tenant">
      <ng-container *ngIf="tenant.slug !== defaultTenantSlug; else itscBrand">
        <mat-icon class="welcome-tenant-icon">school</mat-icon>
        <h2 class="welcome-tenant-name">{{ tenant.name }}</h2>
      </ng-container>
    </ng-container>
    <ng-template #itscBrand>
      <img class="welcome-logo" src="assets/images/logoITSC.png" alt="Logo ITSC" />
      <img class="welcome-wordmark" src="assets/images/texto1.png" alt="ITSC" />
    </ng-template>
    <h1 class="welcome-title">¡Te da la bienvenida!</h1>
  </section>

  <section class="form-section">
    <mat-card class="auth-card">
      <div class="auth-logo">
        <div class="logo-circle">
          <mat-icon>person</mat-icon> 
        </div>
      </div>

      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <mat-form-field appearance="fill">
          <mat-label>{{ 'auth.email' | translate }}</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />

          <mat-error *ngIf="loginForm.get('email')?.errors?.['required']">{{ 'auth.emailRequired' | translate }}</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.errors?.['email']">{{ 'auth.validEmail' | translate }}</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>{{ 'auth.password' | translate }}</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password" />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.get('password')?.errors?.['required']">{{ 'auth.passwordRequired' | translate }}</mat-error>
        </mat-form-field>

        <!-- Mensaje de error de datos validos-->
        <mat-error *ngIf="errorMessage" class="login-error" role="alert" aria-live="assertive">
          {{ errorMessage }} </mat-error>

        <div class="remember-section">
            <mat-checkbox formControlName="rememberMe">
              Recordarme
            </mat-checkbox>
        </div>
        <div class="auth-actions">
          <button mat-raised-button class="login-button" type="submit" [disabled]="isLoading">
            <mat-spinner *ngIf="isLoading" diameter="20" style="display: inline-block; margin-right: 8px;"></mat-spinner>
            {{ isLoading ? ('common.loading' | translate) : ('auth.signIn' | translate) }}
          </button>
        </div>
        <!-- Iniciar sesión con Google: solo para cuentas que ya existen con ese correo -->
        <div class="google-login" [hidden]="!googleEnabled">
          <span class="google-divider">o</span>
          <div #googleButton class="google-button"></div>
        </div>

        <a class="forgot-password" [routerLink]="['/auth/forgot-password']">
            ¿Olvidaste tu contraseña?
        </a>

        <button mat-raised-button class="register-button" type="button" [routerLink]="['/auth/signup']" >
          Registrarse
        </button>
        </form>
      </mat-card-content>
    </mat-card>
  </section>
</div>
