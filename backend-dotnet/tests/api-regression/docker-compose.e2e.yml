name: academia-digital-api-e2e

services:
  db-e2e:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${E2E_SA_PASSWORD:?E2E_SA_PASSWORD is required}"
      MSSQL_PID: Developer
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_e2e_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD
        - /opt/mssql-tools18/bin/sqlcmd
        - -S
        - localhost
        - -U
        - sa
        - -P
        - "${E2E_SA_PASSWORD:?E2E_SA_PASSWORD is required}"
        - -Q
        - SELECT 1
        - -No
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api-e2e:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db-e2e;Database=${E2E_DATABASE_NAME:-AcademiaDigitalE2E};User Id=sa;Password=${E2E_SA_PASSWORD:?E2E_SA_PASSWORD is required};TrustServerCertificate=True;"
      Jwt__SecretKey: "${E2E_JWT_SECRET:?E2E_JWT_SECRET is required}"
      Jwt__ExpirationDays: 7
      AdmissionAntiAbuse__RateLimit__Enabled: "true"
      AdmissionAntiAbuse__RateLimit__PermitLimit: 10
      AdmissionAntiAbuse__RateLimit__WindowSeconds: 1
      AdmissionAntiAbuse__RateLimit__QueueLimit: 0
      AdmissionAntiAbuse__Challenge__Mode: StaticToken
      AdmissionAntiAbuse__Challenge__Secret: "${E2E_ADMISSION_CHALLENGE_TOKEN:-e2e-admission-challenge-token}"
      Cors__AllowedOrigins__0: http://localhost:4200
    ports:
      - "8010:8000"
    depends_on:
      db-e2e:
        condition: service_healthy

volumes:
  sqlserver_e2e_data:
