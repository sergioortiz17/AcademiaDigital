<div class="auth-wrapper">
  <div class="auth-content">
    <div class="auth-bg">
      <span class="r"></span>
      <span class="r s"></span>
      <span class="r s"></span>
      <span class="r"></span>
    </div>
    <div class="card borderless text-center">
      <div class="card-body">
        <h4 class="mb-4">{{ 'auth.appName' | translate }}</h4>

        <div class="mb-4">
          <i class="feather icon-unlock auth-icon"></i>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

          <div class="form-group mb-3">
            <input
              type="email"
              class="form-control"
              [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.errors"
              formControlName="email"
              [placeholder]="'auth.email' | translate"
            />
            <small class="text-danger form-text" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']">
              {{ 'auth.emailRequired' | translate }}
            </small>
            <small class="text-danger form-text" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']">
              {{ 'auth.validEmail' | translate }}
            </small>
          </div>

          <div class="form-group mb-4">
            <input
              type="password"
              class="form-control"
              [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.errors"
              formControlName="password"
              [placeholder]="'auth.password' | translate"
            />
            <small class="text-danger form-text" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']">
              {{ 'auth.passwordRequired' | translate }}
            </small>
          </div>

          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
          </div>

          <div class="custom-control custom-checkbox text-left mb-4 mt-2">
            <input type="checkbox" class="custom-control-input" id="customCheck1" />
            <label class="custom-control-label" for="customCheck1">
              {{ 'auth.saveCredentials' | translate }}
            </label>
          </div>

          <div class="row">
            <div class="col mt-2">
              <button
                type="submit"
                class="btn btn-primary btn-block"
                [disabled]="isLoading"
              >
                {{ isLoading ? ('common.loading' | translate) : ('auth.signIn' | translate) }}
              </button>
            </div>
          </div>

        </form>

        <hr />

        <p class="mb-0 text-muted">
          {{ 'auth.dontHaveAccount' | translate }}
          <a [routerLink]="['/auth/signup']" class="f-w-400">
            {{ 'auth.signUp' | translate }}
          </a>
        </p>
        <br />
      </div>
    </div>
  </div>
</div>
