<h2 mat-dialog-title>Nueva carrera</h2>

<mat-dialog-content>
  <div *ngIf="errorMsg" class="msg msg--error">
    <mat-icon>error</mat-icon> {{ errorMsg }}
  </div>

  <form (ngSubmit)="onSubmit()" #createForm="ngForm">
    <div class="form-grid">
      <div class="form-group">
        <label class="custom-label">Nombre:</label>
        <mat-form-field appearance="outline">
          <input matInput [(ngModel)]="name" name="name" required maxlength="200" placeholder="Ingrese el nombre" />
        </mat-form-field>
      </div>

      <div class="form-group">
        <label class="custom-label">Código:</label>
        <mat-form-field appearance="outline">
          <input matInput [(ngModel)]="code" name="code" required maxlength="20" placeholder="Ej: ENF2025" />
        </mat-form-field>
      </div>

      <div class="form-group full-width">
        <label class="custom-label">Descripción:</label>
        <mat-form-field appearance="outline">
          <textarea matInput [(ngModel)]="description" name="description" maxlength="1000" rows="1" placeholder="Ingrese la descripción"></textarea>
        </mat-form-field>
      </div>

      <div class="form-group">
        <label class="custom-label">Créditos totales:</label>
        <mat-form-field appearance="outline">
          <input matInput type="number" min="0" [(ngModel)]="totalCredits" name="totalCredits" required placeholder="0" />
        </mat-form-field>
      </div>

      <div class="form-group">
        <label class="custom-label">Duración (años):</label>
        <mat-form-field appearance="outline">
          <input matInput type="number" min="1" max="20" [(ngModel)]="durationYears" name="durationYears" required placeholder="Ej: 4" />
        </mat-form-field>
      </div>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button type="button" mat-button (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="isLoading || !isFormValid">
    <mat-spinner *ngIf="isLoading" diameter="18" class="btn-spinner"></mat-spinner>
    <span *ngIf="!isLoading">Crear carrera</span>
    <span *ngIf="isLoading">Creando...</span>
  </button>
</mat-dialog-actions>
