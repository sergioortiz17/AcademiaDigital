<div class="profile-modal">

  <div class="modal-header">

    <div class="user-chip">
      <mat-icon>person</mat-icon>
      {{ data.username }} {{ data.lastName }}
    </div>

    <button mat-icon-button  class="close-btn" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="modal-content">

    <div class="modal-fields">
    <div class="field">
      <label>Legajo *</label>
      <input type="text" [(ngModel)]="data.legajo" maxlength="50" [readonly]="data.studentId == null">
    </div>
    <div class="field">
      <label>Carrera</label>
      <input type="text" [value]="data.carrera" readonly>
    </div>
    <div class="field">
      <label>Fecha de nacimiento</label>
      <input [value]="data.birthDate | date:'dd/MM/yyyy'" readonly>
    </div>
    <div class="field">
      <label>Teléfono</label>
      <input [value]="data.phone" readonly>
    </div>
  </div>

  <div class="modal-actions">
    <div *ngIf="errorMsg" class="save-error" role="alert">{{ errorMsg }}</div>
    <button class="save-btn" [disabled]="data.studentId == null || !data.legajo.trim() || data.legajo.length > 50 || isSaving" (click)="save()">
      {{ isSaving ? 'Guardando...' : 'Guardar' }}
    </button>
  </div>
  </div>
</div>
