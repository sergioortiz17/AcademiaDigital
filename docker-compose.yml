networks:
  app_network:
    driver: bridge

services:

  # ── Base de datos ─────────────────────────────────────────────────────────
  db:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-Admin1234!}"
      POSTGRES_DB: "${POSTGRES_DB:-AcademiaDigital}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-AcademiaDigital}"]
      interval: 10s
      retries: 6
      start_period: 15s
    networks:
      - app_network

  # ── Backend .NET ──────────────────────────────────────────────────────────
  backend:
    container_name: dotnet_backend
    build:
      context: .
      dockerfile: backend-dotnet/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-AcademiaDigital};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-Admin1234!}
      - Jwt__SecretKey=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - Jwt__ExpirationDays=7
      - Cors__AllowedOrigins__0=http://localhost:4200
      # Microservicio Finance (ADR 0001). Fire-and-forget: si no está disponible, la matriculación
      # no se bloquea. finance_api se levanta con docker-compose.finance.yml en la misma red.
      - Finance__BaseUrl=http://finance_api:8091

  # ── Frontend Angular ──────────────────────────────────────────────────────
  frontend:
    container_name: angular_frontend
    build:
      context: ./frontend-angular
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
