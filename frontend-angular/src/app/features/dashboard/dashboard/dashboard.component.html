<div class="dashboard-content">
<div class="date-text">
  {{ today | date:'fullDate':'':'es' }} <!--- {{ currentDate }} -->
</div>

<section class="welcome-card">

    <div class="welcome-content">
      <h1>¡Hola, Usuario! 👋</h1>
      <!-- <p>Bienvenido nuevamente a Academia Digital.</p> --> 
    </div>
</section>


<div class="dashboard-grid">
  <mat-card class="main-panel">
    <mat-card-content>
      <!-- <img src="assets/images/logo.svg" alt="ITSC" class="dashboard-logo" /> -->
      <div *ngFor="let item of carouselItems; let i = index" [hidden]="activeSlide !== i">
        <h3 class="carousel-title"> 
          {{ item.title }}
        </h3>
        <p class="carousel-desc">
            {{ item.description }}
        </p>
      </div>

      <div class="carousel-dots">
        <button *ngFor="let item of carouselItems; let i = index" [class.active]="activeSlide === i" (click)="goToSlide(i)"></button>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-card class="alerts-card">
    <div class="alerts-header">
      <h2>Avisos Importantes</h2>
      <mat-icon>
        notifications
      </mat-icon>
    </div>

    <!-- <mat-divider></mat-divider> -->

    <mat-card-content class="alerts-content">
      <p>Examen de Programación 12/05</p>
      <p>Entrega de Trabajo Práctico hasta el 10/05</p>
      <p>Inscripciones abiertas para el próximo cuatrimestre</p>
    </mat-card-content>
  </mat-card>

</div>
</div>
