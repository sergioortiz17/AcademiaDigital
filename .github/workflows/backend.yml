name: Backend CI

on:
  pull_request:
    branches: [main, integracion-14-11]
    paths:
      - 'backend-dotnet/**'
      - 'services/AcademiaDigital.Finance.Contracts/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main, integracion-14-11]
    paths:
      - 'backend-dotnet/**'
      - 'services/AcademiaDigital.Finance.Contracts/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: 'backend-dotnet/AcademiaDigital.sln'

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}
      - name: Build Release
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration Release
      - name: Domain tests
        run: dotnet test backend-dotnet/tests/AcademiaDigital.Domain.UnitTests/AcademiaDigital.Domain.UnitTests.csproj --no-build --configuration Release
      - name: Application tests
        run: dotnet test backend-dotnet/tests/AcademiaDigital.Application.UnitTests/AcademiaDigital.Application.UnitTests.csproj --no-build --configuration Release

  migrations:
    name: PostgreSQL clean migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
          POSTGRES_DB: academia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=academia_ci;Username=postgres;Password=postgres_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore local tools
        working-directory: backend-dotnet
        run: dotnet tool restore
      - name: Restore backend
        run: dotnet restore ${{ env.SOLUTION }}
      - name: Apply all migrations to an empty database
        working-directory: backend-dotnet
        run: >-
          dotnet ef database update
          --project src/AcademiaDigital.Infrastructure
          --startup-project src/AcademiaDigital.API
          --configuration Release
