name: Backend Architecture

on:
  pull_request:
    branches: [main, integracion-14-11]
    paths:
      - 'backend-dotnet/**'
      - 'services/AcademiaDigital.Finance.Contracts/**'
      - '.github/workflows/architecture.yml'
  push:
    branches: [main, integracion-14-11]
    paths:
      - 'backend-dotnet/**'
      - 'services/AcademiaDigital.Finance.Contracts/**'
      - '.github/workflows/architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archunitnet:
    name: ArchUnitNET
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend-dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore architecture tests
        run: dotnet restore tests/AcademiaDigital.ArchitectureTests/AcademiaDigital.ArchitectureTests.csproj
      - name: Validate architecture
        run: dotnet test tests/AcademiaDigital.ArchitectureTests/AcademiaDigital.ArchitectureTests.csproj --configuration Release --no-restore
