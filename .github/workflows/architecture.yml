name: Backend Architecture

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend-dotnet/**'
      - '.github/workflows/architecture.yml'
  push:
    branches: [main]
    paths:
      - 'backend-dotnet/**'
      - '.github/workflows/architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archunitnet:
    name: ArchUnitNET
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend-dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore architecture tests
        run: dotnet restore tests/AcademiaDigital.ArchitectureTests/AcademiaDigital.ArchitectureTests.csproj

      - name: Validate architecture
        run: dotnet test tests/AcademiaDigital.ArchitectureTests/AcademiaDigital.ArchitectureTests.csproj --configuration Debug --no-restore
