<div class="layout-container">
  <mat-toolbar color="primary" class="main-toolbar">
      <button mat-icon-button class="menu-button" (click)="toggleSidenav()" aria-label="Toggle menu">
        <mat-icon>menu</mat-icon>
      </button>
    <!--  <span class="toolbar-title">AcademiaDigital</span> --> 
    <div class="toolbar-brand">
      <div class="toolbar-logo-wrapper">
        <img src="assets/images/logo-nav1.svg" alt="ITSC" class="toolbar-logo" />
      </div>
      <img src="assets/images/texto1.png" alt="textoITSC" class="toolbar-text" />
    </div>
      <span class="spacer"></span>
      <app-nav-right></app-nav-right>
  </mat-toolbar>
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #sidenav
    class="sidenav"
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile">
    <app-navigation (menuItemClick)="isMobile && sidenav.close()"></app-navigation>
    </mat-sidenav>

    <mat-sidenav-content class="content-area">
      <main class="dashboard-container">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
