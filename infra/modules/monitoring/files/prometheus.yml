# Prometheus de la instancia de monitoreo.
# Las métricas de las instancias de Beanstalk llegan por remote write desde Alloy
# (--web.enable-remote-write-receiver); acá solo se scrapean los servicios locales.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
