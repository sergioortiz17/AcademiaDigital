<div class="page-header">
  <h1>{{ 'dashboard.title' | translate }}</h1>
</div>

<mat-card class="dashboard-card">
  <mat-card-content style="text-align: center; padding: 24px 16px 8px;">
    <img src="assets/images/logo.svg" alt="ITSC" style="width: 96px; height: 96px;" />
  </mat-card-content>

  <mat-divider></mat-divider>

  <mat-card-content style="min-height: 100px; text-align: center; padding: 24px 16px;">
    <div *ngFor="let item of carouselItems; let i = index" [hidden]="activeSlide !== i">
      <h3 class="carousel-title">{{ item.title }}</h3>
      <p class="carousel-desc">{{ item.description }}</p>
    </div>
    <div class="carousel-dots">
      <button
        *ngFor="let item of carouselItems; let i = index"
        [class.active]="activeSlide === i"
        (click)="goToSlide(i)">
      </button>
    </div>
  </mat-card-content>

  <div class="progress-section">
    <h3>{{ 'dashboard.progress' | translate: { progress: 1 } }}</h3>
    <mat-progress-bar mode="determinate" value="100" color="accent"></mat-progress-bar>
  </div>
</mat-card>
