<div class="dialog-header">
  <mat-icon>warning</mat-icon>
  <span>Rechazar solicitud</span>
</div>

<div class="dialog-body">
  <p>
    Estás por rechazar la solicitud de <strong>{{ data.certificateType }}</strong>
    <span *ngIf="data.username"> de <strong>{{ data.username }}</strong></span>.
  </p>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Motivo del rechazo</mat-label>
    <textarea
      matInput
      rows="3"
      maxlength="1000"
      [(ngModel)]="reason"
      placeholder="Explicá brevemente por qué se rechaza la solicitud">
    </textarea>
    <mat-hint *ngIf="reason.trim().length < 3">Mínimo 3 caracteres.</mat-hint>
  </mat-form-field>
</div>

<div class="dialog-actions">
  <button mat-flat-button class="cancel-btn" (click)="cancel()">Cancelar</button>
  <button mat-stroked-button class="confirm-btn" [disabled]="!isValid" (click)="confirm()">
    Rechazar
  </button>
</div>
