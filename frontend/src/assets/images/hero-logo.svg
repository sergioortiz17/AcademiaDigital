<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" role="img" aria-label="Instituto Técnico Superior Córdoba">
  <!-- Fondo -->
  <rect width="100%" height="100%" fill="#0E5C84" rx="8"/>

  <!-- Grupo contenido con margen -->
  <g transform="translate(28,28)">
    <!-- Isotipo "it" (texto para que sea editable; usa una fuente sans bold) -->
    <g font-family="Montserrat, Inter, Poppins, Arial, sans-serif" font-weight="800" fill="#FFFFFF">
      <!-- Bloque 'it' grande -->
      <text x="0" y="100" font-size="120" letter-spacing="0">it</text>
    </g>

    <!-- Texto a la derecha -->
    <g font-family="Montserrat, Inter, Poppins, Arial, sans-serif" fill="#FFFFFF" font-weight="700">
      <text x="150" y="68" font-size="44">Instituto Técnico</text>
      <text x="150" y="116" font-size="44">Superior Córdoba</text>
    </g>
  </g>
</svg>